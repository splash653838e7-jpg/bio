
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="GruwMane — аудиомейкер и digital creator. Мои проекты и контакты.">
  <title>гравмейн</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --surface: #1b1b1d;
      --text: #f5f5f7;
      --muted: #96969e;
      --border: #303033;
      --button: #f5f5f7;
      --button-text: #111111;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #dedee3;
      --button: #1d1d1f;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", sans-serif;
      transition: none;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .nav {
      max-width: 1120px;
      margin: auto;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.6px;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 100px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 13px;
    }

    .theme-toggle:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 4px;
    }

    main {
      max-width: 1120px;
      margin: auto;
      padding: 90px 28px 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 52px;
      align-items: start;
    }

    .avatar {
      width: 180px;
      aspect-ratio: 1;
      border-radius: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 66px;
      font-weight: 650;
      letter-spacing: -7px;
    }

    .eyebrow {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 5px 0 22px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 92px);
      letter-spacing: -0.075em;
      line-height: 0.98;
      margin: 0 0 25px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .intro {
      font-size: clamp(17px, 2.5vw, 21px);
      line-height: 1.65;
      color: var(--muted);
      max-width: 570px;
      margin: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 19px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 14px;
      font-weight: 550;
    }

    .action.primary {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 100px 0 36px;
    }

    .section-heading {
      font-size: 13px;
      font-weight: 550;
      color: var(--muted);
      margin: 0 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: block;
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .platform {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .arrow {
      font-size: 20px;
    }

    .card h2 {
      font-size: 22px;
      letter-spacing: -0.7px;
      margin: 0 0 8px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .about {
      font-size: 16px;
      line-height: 1.9;
      max-width: 680px;
      color: var(--muted);
    }

    footer {
      max-width: 1120px;
      margin: auto;
      padding: 25px 28px 35px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .nav {
        padding: 20px;
      }

      main {
        padding: 54px 20px 35px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .avatar {
        width: 100px;
        border-radius: 25px;
        font-size: 43px;
        letter-spacing: -5px;
      }

      h1 {
        font-size: clamp(43px, 12vw, 65px);
      }

      .divider {
        margin: 65px 0 28px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
      }

      footer {
        padding: 22px 20px 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="nav">
    <a class="brand" href="#">GruwMane.</a>
    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Переключить тему"
    >☀ Светлая тема</button>
  </header>

  <main>
    <section class="hero">
      <div class="avatar" aria-label="Логотип GruwMane">G.</div>

      <div>
        <p class="eyebrow">био </p>
        <h1>GruwMane.</h1>
        <p class="intro">
          аудиомейкер, делаю аудио,и т.д.
        </p>

        <div class="actions">
          <a class="action primary"
             href="https://t.me/Nbivw"
             target="_blank"
             rel="noopener noreferrer">
            связаться со мной ↗
          </a>
          <a class="action"
             href="https://www.tiktok.com/@gruwmane"
             target="_blank"
             rel="noopener noreferrer">
            мой тик ток
          </a>
        </div>
      </div>
    </section>

    <hr class="divider">

    <section>
      <p class="section-heading">01 / мои соцсети</p>

      <div class="cards">
        <a class="card"
           href="https://t.me/Nbivw"
           target="_blank"
           rel="noopener noreferrer">
          <div class="card-top">
            <span class="platform">Telegram</span>
            <span class="arrow">↗</span>
          </div>
          <h2>@Nbivw</h2>
          <p>в тг, по коллабе пишите туда</p>
        </a>

        <a class="card"
           href="https://www.tiktok.com/@gruwmane"
           target="_blank"
           rel="noopener noreferrer">
          <div class="card-top">
            <span class="platform">TikTok</span>
            <span class="arrow">↗</span>
          </div>
          <h2>@gruwmane</h2>
          <p>что снимаю</p>
        </a>
      </div>
    </section>

    <hr class="divider">

    <section>
      <p class="section-heading">02 / ОБО МНЕ</p>
      <p class="about">
       я гравмейн я аудиомейкер хочешь коллабу пиши в тг/тт
      </p>
    </section>
  </main>

  <footer>
    <span>грав мейн<span id="year">2026</span></span>
    <span>сайт на вайбкодил</span>
  </footer>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function setTheme(theme) {
      root.dataset.theme = theme;
      const dark = theme === "dark";

      toggle.textContent = dark
        ? "☀ Светлая тема"
        : "☾ Тёмная тема";

      themeColor.content = dark ? "#111111" : "#f5f5f7";
      toggle.setAttribute("aria-pressed", String(!dark));

      try {
        localStorage.setItem("gruwmane-theme", theme);
      } catch (error) {}
    }

    let savedTheme = "dark";

    try {
      savedTheme = localStorage.getItem("gruwmane-theme") || "dark";
    } catch (error) {}

    setTheme(savedTheme === "light" ? "light" : "dark");

    toggle.addEventListener("click", () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark");
    });

    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
